    <!-- Cross-Engine CSS Standards (Blink, WebKit, Gecko) -->
    <style>
      /* CSS Reset & Modern Dynamic Viewport Standards */
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        width: 100%;
        height: 100%;
        margin: 0;

          padding-left: env(safe-area-inset-left);

      }

      .cric-swal-confirm-btn,

  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; color: #fff; background: #020612;">
        JavaScript is required to view live cricket scores and fixtures. Please enable JavaScript to continue.
      </div>
    </noscript>

    <!-- ============================================================ -->
    <!-- CRICKET FEDERATION OFFICIAL VIDEO PRELOADER (WEB & MOBILE)    -->
    <!-- ============================================================ -->
    <div id="cfvd-preloader-root" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #020612;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    ">
      <!-- Background Ambient Vignette -->
      <div style="
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(circle at center, rgba(15, 23, 42, 0) 55%, rgba(2, 6, 18, 0.9) 100%);
        pointer-events: none;
        z-index: 2;
      "></div>

      <!-- Main Video Container -->
      <div style="
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        background-color: #020612;
      ">
        <video
          id="cfvd-preloader-video"
          autoplay
          muted
          playsinline
          preload="auto"
          style="
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #020612;
          "
        >
          <source src="/preloader.mp4" type="video/mp4" />
          <source src="./preloader.mp4" type="video/mp4" />
          <source src="/assets/preloader.mp4" type="video/mp4" />
          <source src="http://localhost:5000/uploads/preloader.mp4" type="video/mp4" />
        </video>
      </div>

      <!-- Floating Controls: Top Bar -->
      <div style="
        position: absolute;
        top: 24px;
        left: 20px;
        right: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 10;
        pointer-events: auto;
      ">
        <!-- Brand Badge -->
        <div style="
          display: flex;
          align-items: center;
          gap: 10px;
          background: rgba(2, 6, 18, 0.75);
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
          border: 1px solid rgba(245, 158, 11, 0.35);
          padding: 7px 16px;
          border-radius: 9999px;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        ">
          <span style="font-size: 15px;">🏏</span>
          <span style="
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 1.2px;
            color: #f59e0b;
            text-transform: uppercase;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          ">CRICKET FEDERATION</span>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
          <!-- Sound Toggle Button -->
          <button
            id="cfvd-sound-btn"
            type="button"
            style="
              background: rgba(15, 23, 42, 0.8);
              backdrop-filter: blur(14px);
              -webkit-backdrop-filter: blur(14px);
              border: 1px solid rgba(255, 255, 255, 0.2);
              color: #f8fafc;
              padding: 8px 16px;
              border-radius: 9999px;
              font-size: 12px;
              font-weight: 700;
              letter-spacing: 0.6px;
              cursor: pointer;
              display: flex;
              align-items: center;
              gap: 6px;
              transition: all 0.2s ease;
            "
          >
            <span id="cfvd-sound-icon">🔇</span>
            <span id="cfvd-sound-text">UNMUTE</span>
          </button>

          <!-- Skip Button -->
          <button
            id="cfvd-skip-btn"
            type="button"
            style="
              background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
              color: #020612;
              border: 1px solid rgba(251, 191, 36, 0.9);
              padding: 8px 20px;
              border-radius: 9999px;
              font-size: 12px;
              font-weight: 800;
              letter-spacing: 0.8px;
              cursor: pointer;
              display: flex;
              align-items: center;
              gap: 6px;
              box-shadow: 0 4px 18px rgba(245, 158, 11, 0.4);
              transition: all 0.2s ease;
            "
          >
            <span>SKIP INTRO</span>
            <span style="font-size: 14px; font-weight: 900;">✕</span>
          </button>
        </div>
      </div>

      <!-- Bottom Progress Bar & Title -->
      <div style="
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: linear-gradient(to top, rgba(2, 6, 18, 0.95) 0%, rgba(2, 6, 18, 0) 100%);
        padding: 28px 20px 16px 20px;
        pointer-events: none;
      ">
        <div style="
          font-size: 11.5px;
          font-weight: 700;
          color: #94a3b8;
          letter-spacing: 1.2px;
          text-transform: uppercase;
          margin-bottom: 10px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        ">
          VIRUDHUNAGAR DISTRICT CRICKET ASSOCIATION • OFFICIAL PORTAL
        </div>
        <!-- Progress Bar Track -->
        <div style="
          width: 100%;
          max-width: 480px;
          height: 3.5px;
          background: rgba(255, 255, 255, 0.14);
          border-radius: 3px;
          overflow: hidden;
        ">
          <div id="cfvd-preloader-progress" style="
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            border-radius: 3px;
            transition: width 0.1s linear;
          "></div>
        </div>
      </div>
    </div>

    <script>
      (function() {
        var preloader = document.getElementById('cfvd-preloader-root');
        var video = document.getElementById('cfvd-preloader-video');
        var skipBtn = document.getElementById('cfvd-skip-btn');
        var soundBtn = document.getElementById('cfvd-sound-btn');
        var soundIcon = document.getElementById('cfvd-sound-icon');
        var soundText = document.getElementById('cfvd-sound-text');
        var progressBar = document.getElementById('cfvd-preloader-progress');

        if (!preloader || !video) return;

        // Check if user already saw the preloader in this session
        var hasSeen = false;
        try {
          hasSeen = Boolean(sessionStorage.getItem('cfvd_preloader_seen'));
        } catch(e) {}

        var dismissed = false;
        window.__dismissCfvdPreloader = function(immediate) {
          if (dismissed) return;
          dismissed = true;
          try {
            sessionStorage.setItem('cfvd_preloader_seen', 'true');
          } catch(e) {}

          if (immediate) {
            preloader.style.display = 'none';
            if (video) video.pause();
            return;
          }

          preloader.style.opacity = '0';
          preloader.style.visibility = 'hidden';
          setTimeout(function() {
            if (video) video.pause();
            if (preloader.parentNode) {
              preloader.parentNode.removeChild(preloader);
            }
          }, 700);
        };

        if (hasSeen) {
          window.__dismissCfvdPreloader(true);
          return;
        }

        if (skipBtn) {
          skipBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            window.__dismissCfvdPreloader(false);
          });
        }

        if (soundBtn) {
          soundBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (video.muted) {
              video.muted = false;
              soundIcon.textContent = '🔊';
              soundText.textContent = 'MUTE';
              soundBtn.style.borderColor = 'rgba(245, 158, 11, 0.8)';
              soundBtn.style.background = 'rgba(245, 158, 11, 0.25)';
            } else {
              video.muted = true;
              soundIcon.textContent = '🔇';
              soundText.textContent = 'UNMUTE';
              soundBtn.style.borderColor = 'rgba(255, 255, 255, 0.2)';
              soundBtn.style.background = 'rgba(15, 23, 42, 0.8)';
            }
          });
        }

        video.addEventListener('timeupdate', function() {
          if (video.duration && progressBar) {
            var pct = (video.currentTime / video.duration) * 100;
            progressBar.style.width = Math.min(100, pct) + '%';
          }
        });

        video.addEventListener('ended', function() {
          window.__dismissCfvdPreloader(false);
        });

        // Safety fallback timeout after 9.5s
        setTimeout(function() {
          window.__dismissCfvdPreloader(false);
        }, 9500);

        var playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(function() {
            video.muted = true;
            video.play().catch(function() {});
          });
        }
      })();
    </script>

    <div id="root"></div>
  </body>
