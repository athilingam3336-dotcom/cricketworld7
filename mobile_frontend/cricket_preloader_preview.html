<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Circle Preloader (Plays Once)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #f6f2e9; /* 100% UNIFORM FULL SCREEN COLOR */
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* ── CIRCLE OUTER CONTAINER ── */
    .circle-frame {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Subtle rotating decorative orbit ring with gold accents */
    .decorative-ring {
      position: absolute;
      width: 216px;
      height: 216px;
      border-radius: 50%;
      border: 1.5px dashed #e5dec9;
      animation: spinRing 8s linear infinite;
    }

    .ring-dot {
      position: absolute;
      top: -3.5px;
      left: 50%;
      transform: translateX(-50%);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d4af37;
      box-shadow: 0 0 6px #d4af37;
    }

    @keyframes spinRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ── INNER CIRCLE (ALL ANIMATION INSIDE) ── */
    .circle-inner {
      position: relative;
      width: 196px;
      height: 196px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #e5dec9;
      box-shadow: 0 12px 28px -6px rgba(133, 77, 14, 0.14), 0 8px 12px -6px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* Pitch Turf & Crease */
    .pitch-turf {
      position: absolute;
      bottom: 22px;
      width: 170px;
      height: 12px;
      background: linear-gradient(90deg, #15803d, #16a34a 50%, #15803d);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .crease-white {
      width: 130px;
      height: 1.5px;
      background: rgba(255, 255, 255, 0.95);
    }

    /* Pitch Bounce Dust Puff */
    .pitch-puff {
      position: absolute;
      left: 64px;
      bottom: 24px;
      width: 18px;
      height: 7px;
      border-radius: 50%;
      background: rgba(148, 163, 184, 0.75);
      z-index: 2;
      opacity: 0;
    }

    .active .pitch-puff {
      animation: puffPitched 1.35s ease-out forwards;
    }

    @keyframes puffPitched {
      0%, 25% { transform: scale(0.3); opacity: 0; }
      27% { transform: scale(0.6); opacity: 0.95; }
      34% { transform: scale(2); opacity: 0; }
      100% { opacity: 0; }
    }

    /* Ground Shockwave on Stumps collision */
    .impact-shockwave {
      position: absolute;
      bottom: 24px;
      width: 42px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #ef4444;
      z-index: 2;
      opacity: 0;
    }

    .active .impact-shockwave {
      animation: shockwaveBoom 1.35s ease-out forwards;
    }

    @keyframes shockwaveBoom {
      0%, 39% { transform: scale(0.2); opacity: 0; }
      41% { transform: scale(0.4); opacity: 1; box-shadow: 0 0 12px #ef4444; }
      55% { transform: scale(2.4); opacity: 0; }
      100% { opacity: 0; }
    }

    /* Impact Flash Burst */
    .impact-flash {
      position: absolute;
      bottom: 36px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fbbf24;
      border: 2px solid #ffffff;
      z-index: 10;
      opacity: 0;
    }

    .active .impact-flash {
      animation: flashBurst 1.35s ease-out forwards;
    }

    @keyframes flashBurst {
      0%, 39% { transform: scale(0.2); opacity: 0; }
      41% { transform: scale(0.5); opacity: 1; box-shadow: 0 0 20px #fbbf24, 0 0 40px #ffffff; }
      52% { transform: scale(2.2); opacity: 0; }
      100% { opacity: 0; }
    }

    /* Sparks Flying */
    .spark {
      position: absolute;
      bottom: 46px;
      width: 4.5px;
      height: 4.5px;
      border-radius: 50%;
      background: #fbbf24;
      z-index: 11;
      opacity: 0;
    }

    .active .spark-1 {
      animation: sparkFly1 1.35s ease-out forwards;
    }
    @keyframes sparkFly1 {
      0%, 40% { transform: translate(0, 0); opacity: 0; }
      42% { opacity: 1; }
      58% { transform: translate(28px, -32px); opacity: 0; }
      100% { opacity: 0; }
    }

    .active .spark-2 {
      background: #ef4444;
      animation: sparkFly2 1.35s ease-out forwards;
    }
    @keyframes sparkFly2 {
      0%, 40% { transform: translate(0, 0); opacity: 0; }
      42% { opacity: 1; }
      58% { transform: translate(-24px, -28px); opacity: 0; }
      100% { opacity: 0; }
    }

    /* ── WICKETS LAYER & STICKS THERIKURATHU ANIMATION (PLAYS ONCE) ── */
    .wickets-layer {
      position: absolute;
      bottom: 24px;
      width: 38px;
      height: 58px;
      z-index: 5;
    }

    /* BAILS */
    .bail-left {
      position: absolute;
      top: 0;
      left: 1px;
      width: 15px;
      height: 3px;
      border-radius: 1.5px;
      background: #f59e0b;
      border: 0.5px solid #78350f;
      z-index: 6;
    }

    .active .bail-left {
      animation: bailLeftBlast 1.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes bailLeftBlast {
      0%, 40% { transform: translate(0, 0) rotate(0deg); }
      41% { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
      68%, 100% { transform: translate(-45px, -68px) rotate(-380deg); opacity: 0.8; }
    }

    .bail-right {
      position: absolute;
      top: 0;
      right: 1px;
      width: 15px;
      height: 3px;
      border-radius: 1.5px;
      background: #f59e0b;
      border: 0.5px solid #78350f;
      z-index: 6;
    }

    .active .bail-right {
      animation: bailRightBlast 1.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes bailRightBlast {
      0%, 40% { transform: translate(0, 0) rotate(0deg); }
      41% { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
      68%, 100% { transform: translate(46px, -62px) rotate(380deg); opacity: 0.8; }
    }

    /* STUMPS (LEG, MIDDLE, OFF) */
    .stump {
      position: absolute;
      bottom: 0;
      width: 4.5px;
      height: 52px;
      background: linear-gradient(180deg, #f59e0b 0%, #b45309 80%, #78350f 100%);
      border-radius: 2px 2px 0 0;
      border: 0.5px solid #78350f;
      overflow: hidden;
    }

    /* 1. LEG STUMP (Left) */
    .stump-leg {
      left: 3px;
    }

    .active .stump-leg {
      animation: legStumpHit 1.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes legStumpHit {
      0%, 40% { transform: translate(0, 0) rotate(0deg); }
      41% { box-shadow: 0 0 8px #ef4444; }
      68%, 100% { transform: translate(-24px, -16px) rotate(-48deg); }
    }

    /* 2. MIDDLE STUMP (Direct Hit! Cartwheels high backward) */
    .stump-middle {
      left: 16px;
      width: 5px;
      background: linear-gradient(180deg, #d97706 0%, #92400e 80%, #78350f 100%);
    }

    .active .stump-middle {
      animation: middleStumpCartwheel 1.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes middleStumpCartwheel {
      0%, 40% { transform: translate(0, 0) rotate(0deg); }
      41% { box-shadow: 0 0 10px #ef4444; }
      68%, 100% { transform: translate(16px, -64px) rotate(205deg); }
    }

    /* 3. OFF STUMP (Flies right and spins) */
    .stump-off {
      right: 3px;
    }

    .active .stump-off {
      animation: offStumpHit 1.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes offStumpHit {
      0%, 40% { transform: translate(0, 0) rotate(0deg); }
      41% { box-shadow: 0 0 8px #ef4444; }
      68%, 100% { transform: translate(40px, -36px) rotate(80deg); }
    }

    /* ── BALL DELIVERY TRAJECTORY (PLAYS ONCE) ── */
    .ball-wrap {
      position: absolute;
      bottom: 30px;
      z-index: 8;
    }

    .active .ball-wrap {
      animation: ballDelivery 1.35s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }

    @keyframes ballDelivery {
      0% {
        transform: translate(-90px, -60px) scale(0.65);
        opacity: 0;
      }
      5% {
        opacity: 1;
      }
      27% {
        transform: translate(-32px, 16px) scale(0.85);
      }
      41% {
        transform: translate(0px, -8px) scale(1);
      }
      56% {
        transform: translate(26px, 12px) scale(0.9);
        opacity: 1;
      }
      70%, 100% {
        transform: translate(38px, 18px) scale(0.8);
        opacity: 0;
      }
    }

    .cricket-ball {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ef4444 0%, #b91c1c 45%, #7f1d1d 85%, #450a0a 100%);
      box-shadow: 0 3px 8px rgba(185, 28, 28, 0.45);
      position: relative;
      overflow: hidden;
      border: 0.8px solid #7f1d1d;
    }

    .ball-shine {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 6px;
      height: 4px;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.8) 0%, transparent 80%);
      border-radius: 50%;
      transform: rotate(-30deg);
    }

    .ball-seam {
      position: absolute;
      width: 1.5px;
      height: 20px;
      left: 9px;
      top: 0;
      background: #ffffff;
      border-style: dashed;
      animation: spinSeam 0.5s linear infinite;
    }

    @keyframes spinSeam {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Replay Trigger */
    .replay-btn {
      position: absolute;
      bottom: 40px;
      padding: 10px 20px;
      background: #ffffff;
      border: 1px solid #e5dec9;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #854d0e;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(133, 77, 14, 0.1);
      transition: all 0.2s ease;
    }

    .replay-btn:hover {
      background: #fdfaf3;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- CIRCLE CONTAINER -->
  <div class="circle-frame" id="circleStage">
    
    <!-- Rotating subtle ring with gold accent dot -->
    <div class="decorative-ring">
      <div class="ring-dot"></div>
    </div>

    <!-- INNER CIRCLE (ALL ANIMATION FRAMED INSIDE) -->
    <div class="circle-inner">

      <!-- Pitch Turf & Crease -->
      <div class="pitch-turf">
        <div class="crease-white"></div>
      </div>

      <!-- Pitch Bounce Dust Puff -->
      <div class="pitch-puff"></div>

      <!-- Collision Shockwave Ring -->
      <div class="impact-shockwave"></div>

      <!-- Collision Flash Burst -->
      <div class="impact-flash"></div>

      <!-- Kinetic Sparks -->
      <div class="spark spark-1"></div>
      <div class="spark spark-2"></div>

      <!-- ── 3 WICKETS & 2 BAILS (STICK THERIKURATHU) ── -->
      <div class="wickets-layer">
        <div class="bail-left"></div>
        <div class="bail-right"></div>

        <div class="stump stump-leg"></div>
        <div class="stump stump-middle"></div>
        <div class="stump stump-off"></div>
      </div>

      <!-- ── CRICKET LEATHER BALL (~20px) ── -->
      <div class="ball-wrap">
        <div class="cricket-ball">
          <div class="ball-shine"></div>
          <div class="ball-seam"></div>
        </div>
      </div>

    </div>

  </div>

  <button class="replay-btn" onclick="playOnce()">🔄 Replay Animation (Plays Once)</button>

  <script>
    const circleStage = document.getElementById('circleStage');

    function playOnce() {
      circleStage.classList.remove('active');
      void circleStage.offsetWidth; // Force DOM reflow
      circleStage.classList.add('active');
    }

    // Auto-play once on page load
    window.onload = () => {
      playOnce();
    };
  </script>

</body>
</html>
